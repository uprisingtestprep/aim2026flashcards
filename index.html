<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artificial Intelligence in Medicine & Clinical Practice &mdash; Flashcards</title>
<style>
  :root {
    --navy:#2B3A67; --accent:#C97064; --tint:#EDEFF5;
    --white:#FFFFFF; --text:#1A1A1A; --muted:#666; --radius:12px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:'Segoe UI', system-ui, sans-serif;
    background:linear-gradient(135deg, var(--navy) 0%, var(--accent) 160%);
    /* Pinned, not min-height: the page must never grow, or the controls get
       pushed below the fold on iOS, where 100dvh and height:100% disagree.
       The height:100% above is the pre-dvh fallback. */
    height:100dvh; max-height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    padding:1.25rem 1rem 1rem; gap:0.75rem;
  }
  header { text-align:center; color:#fff; flex-shrink:0; }
  header .brand { font-size:0.75rem; font-weight:700; letter-spacing:0.1em;
                   opacity:0.8; text-transform:uppercase; }
  header h1 { font-size:1.3rem; font-weight:800; margin-top:0.2rem; }
  header .subtitle { font-size:0.8rem; opacity:0.75; margin-top:0.15rem; }
  #progress-info { display:flex; align-items:center; gap:0.75rem;
                    color:rgba(255,255,255,0.85); font-size:0.8rem;
                    flex-shrink:0; width:100%; max-width:640px; }
  #bar-track { flex:1; background:rgba(255,255,255,0.25);
                border-radius:4px; height:5px; }
  #bar-fill { height:100%; background:#fff; border-radius:4px; transition:width .3s; }

  .card-scene {
    width:100%; max-width:640px; perspective:1200px; cursor:pointer;
    flex:1; min-height:0; display:flex; flex-direction:column;
    /* WebKit does not clip overflow inside a preserve-3d context, so the
       answer pane's own clip is dropped there and a long answer paints over
       the Prev/Next row. This element only sets the perspective and is NOT
       itself in the 3D context, so its clip is honoured in every engine. */
    overflow:hidden; border-radius:var(--radius);
  }
  .card-inner { position:relative; width:100%; flex:1; min-height:0;
                 transition:transform .55s cubic-bezier(.4,0,.2,1);
                 transform-style:preserve-3d; }
  .card-scene.flipped .card-inner { transform:rotateY(180deg); }
  .card-face {
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:var(--radius); display:flex; flex-direction:column;
    padding:1.5rem 1.75rem; box-shadow:0 12px 40px rgba(0,0,0,.2);
    overflow:hidden;
    /* Painting through a mask forces WebKit to allocate a real clipping layer
       for a 3D-transformed element, which is what makes the overflow:hidden
       and the rounded corners above actually apply. */
    -webkit-mask-image:-webkit-radial-gradient(#fff,#000);
            mask-image:radial-gradient(#fff,#000);
  }
  .card-front { background:var(--white); align-items:center; justify-content:center; }
  .card-back { background:var(--tint); transform:rotateY(180deg); }
  .card-badge { font-size:0.7rem; font-weight:700; text-transform:uppercase;
                 letter-spacing:0.08em; background:var(--tint); color:var(--navy);
                 padding:0.2rem 0.65rem; border-radius:20px;
                 margin-bottom:0.85rem; flex-shrink:0; align-self:flex-start; }
  .card-back .card-badge { background:rgba(255,255,255,.75); }
  .q-text { font-size:1.1rem; font-weight:600; color:var(--navy); line-height:1.55;
             text-align:center; overflow-y:auto; flex:1; min-height:0;
             display:flex; align-items:center; justify-content:center;
             -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .a-label { font-size:0.7rem; font-weight:700; color:var(--accent);
              text-transform:uppercase; letter-spacing:0.08em;
              margin-bottom:0.4rem; flex-shrink:0; }
  .a-text { font-size:0.975rem; color:var(--text); line-height:1.65;
             overflow-y:auto; flex:1; min-height:0; padding-right:4px;
             -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
             scrollbar-width:thin; scrollbar-color:rgba(0,0,0,.3) transparent; }
  .a-text::-webkit-scrollbar { width:4px; }
  .a-text::-webkit-scrollbar-track { background:transparent; }
  .a-text::-webkit-scrollbar-thumb { background:rgba(0,0,0,.3); border-radius:4px; }
  .tap-hint { flex-shrink:0; margin-top:0.6rem; font-size:0.7rem;
               color:var(--muted); text-align:center; }

  .controls { display:flex; gap:0.65rem; flex-wrap:nowrap; justify-content:center;
               flex-shrink:0; width:100%; max-width:640px;
               padding-bottom:env(safe-area-inset-bottom, 0px); }
  .btn { padding:0.6rem 1.2rem; border-radius:50px;
          border:2px solid rgba(255,255,255,.4); background:rgba(255,255,255,.15);
          color:#fff; font-weight:700; font-size:0.875rem; cursor:pointer;
          transition:all .2s; white-space:nowrap; flex:1; max-width:160px; }
  .btn:hover { background:rgba(255,255,255,.3); border-color:rgba(255,255,255,.7); }
  .btn:active { transform:scale(.96); }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  .btn-primary { background:rgba(255,255,255,.9); color:var(--navy); border-color:transparent; }
  .btn-primary:hover { background:#fff; }
  :focus-visible { outline:3px solid #fff; outline-offset:2px; }
  #loading { color:rgba(255,255,255,.85); text-align:center; padding:3rem; flex:1; }

  @media (min-width:768px) {
    body { padding:1.75rem 1.5rem 1.5rem; gap:1rem; }
    header h1 { font-size:1.6rem; }
    .card-face { padding:2rem 2.5rem; }
    .q-text { font-size:1.2rem; }
    .a-text { font-size:1.05rem; }
    .btn { font-size:0.95rem; padding:0.65rem 1.4rem; }
  }
  @media (max-width:380px) {
    .card-face { padding:1rem 1.1rem; }
    .a-text { font-size:0.875rem; }
    .btn { padding:0.55rem 0.8rem; font-size:0.8rem; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">Uprising Test Prep</div>
  <h1>Artificial Intelligence in Medicine & Clinical Practice</h1>
  <div class="subtitle">500 Flashcards</div>
</header>

<div id="progress-info">
  <span id="counter">Card 1 of 500</span>
  <div id="bar-track"><div id="bar-fill" style="width:0%"></div></div>
  <span id="chapter-label"></span>
</div>

<p id="loading">Loading flashcards...</p>

<div class="card-scene" id="scene" style="display:none" onclick="flipCard()">
  <div class="card-inner" id="inner">
    <div class="card-face card-front">
      <div class="card-badge" id="front-badge"></div>
      <div class="q-text" id="q-text"></div>
      <div class="tap-hint">Tap to reveal the answer</div>
    </div>
    <div class="card-face card-back">
      <div class="card-badge" id="back-badge"></div>
      <div class="a-label">Answer</div>
      <div class="a-text" id="a-text"></div>
      <div class="tap-hint">Tap to flip back</div>
    </div>
  </div>
</div>

<div class="controls" id="controls" style="display:none">
  <button class="btn" id="prev-btn" onclick="event.stopPropagation();move(-1)">&larr; Prev</button>
  <button class="btn btn-primary" id="shuffle-btn" onclick="event.stopPropagation();shuffleCards()">Shuffle</button>
  <button class="btn" id="next-btn" onclick="event.stopPropagation();move(1)">Next &rarr;</button>
</div>

<script>
let cards = [], current = 0;

async function init() {
  try {
    const res = await fetch('flashcards.json');
    if (!res.ok) throw new Error('Network error');
    let data = await res.json();
    if (!Array.isArray(data)) data = data.cards || [];
    cards = data;
    document.getElementById('loading').style.display  = 'none';
    document.getElementById('scene').style.display    = 'flex';
    document.getElementById('controls').style.display = 'flex';
    show();
  } catch (e) {
    document.getElementById('loading').textContent =
      'Could not load the flashcards. Please refresh the page.';
  }
}

function chapterLabel(c) {
  const v = c.chapter;
  if (v === undefined || v === null || v === '') return '';
  return String(v).match(/^\d+$/) ? 'Chapter ' + v : String(v);
}

function show() {
  const c = cards[current];
  document.getElementById('scene').classList.remove('flipped');
  document.getElementById('a-text').scrollTop = 0;
  document.getElementById('q-text').scrollTop = 0;
  const label = chapterLabel(c);
  document.getElementById('q-text').textContent      = c.front;
  document.getElementById('a-text').textContent      = c.back;
  document.getElementById('front-badge').textContent = label;
  document.getElementById('back-badge').textContent  = label;
  document.getElementById('counter').textContent     = `Card ${current + 1} of ${cards.length}`;
  document.getElementById('chapter-label').textContent = label;
  document.getElementById('bar-fill').style.width =
    `${((current + 1) / cards.length * 100).toFixed(1)}%`;
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === cards.length - 1;
}

function flipCard() { document.getElementById('scene').classList.toggle('flipped'); }

function move(dir) {
  const next = current + dir;
  if (next < 0 || next >= cards.length) return;
  current = next; show();
}

function shuffleCards() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  current = 0; show();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') move(1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') move(-1);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
});

init();
</script>
</body>
</html>
